<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="text-center">
        <h1 class="text-8xl font-bold text-indigo-600 mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-slate-800 mb-2">Link Not Found</h2>
        <p class="text-slate-500 mb-8 max-w-md mx-auto">Oops! The short link you're looking for doesn't exist, has been removed, or was typed incorrectly.</p>
        <a href="/" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors inline-block">
            Create a Short Link
        </a>
    </div>
</body>
</html>
